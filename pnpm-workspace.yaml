saveExact: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: "no-downgrade"
trustPolicyExcludePrune: true
trustPolicyExclude:
  - semver@6.3.1||5.7.2
  - groq@3.88.1-typegen-experimental.0
  - "@sanity/import@7.0.1"
allowBuilds:
  "@heroui/shared-utils": true
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  DATABASE_URL: "nice_try"
  DIRECT_URL: "nice_try"

jobs:
  quality:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: NextJS Typegen
        run: pnpm next typegen

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run checks
        run: pnpm check
